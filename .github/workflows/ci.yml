name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile || bun install

      - name: Lint
        run: bun run lint

      - name: Test routes
        run: bun run test

      - name: Build
        run: bun run build

  fastapi:
    name: FastAPI (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi-backend/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        env:
          PYTHONPATH: .
        run: pytest tests/ -q
