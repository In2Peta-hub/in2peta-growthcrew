name: Publish backend Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-main
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./fastapi-backend
          file: ./fastapi-backend/Dockerfile
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/in2peta-growthcrew-backend:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/in2peta-growthcrew-backend:${{ github.sha }}

      - name: Redeploy Koyeb service
        if: ${{ vars.KOYEB_SERVICE_ID != '' }}
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
          KOYEB_SERVICE_ID: ${{ vars.KOYEB_SERVICE_ID }}
        run: |
          if [ -z "$KOYEB_API_TOKEN" ]; then
            echo "KOYEB_SERVICE_ID is set, but KOYEB_API_TOKEN is missing."
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null \
            --request POST \
            --header "Authorization: Bearer $KOYEB_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://app.koyeb.com/v1/services/${KOYEB_SERVICE_ID}/redeploy"
          echo "Koyeb redeployment requested."
