services:
  - type: web
    name: growthcrew-backend
    runtime: python
    rootDir: fastapi-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: S3_BUCKET
        value: in2peta-postiz-media
      - key: AWS_REGION
        value: ap-southeast-2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: FB_PAGE_ID
        value: "61594485176950"
      - key: FB_PAGE_ACCESS_TOKEN
        sync: false
      - key: POSTIZ_API_URL
        value: http://127.0.0.1:4007/api/public/v1
      - key: POSTIZ_API_KEY
        sync: false
      - key: MOTHERDUCK_TOKEN
        sync: false
      - key: MOTHERDUCK_DATABASE
        value: business_leads
      # GrowthCrew Outreach (lead generation)
      - key: CORECLAW_API_KEY
        sync: false
      - key: AGENTMAIL_API_KEY
        sync: false
      - key: AGENTMAIL_WEBHOOK_SECRET
        sync: false
      - key: CENTRAL_INBOX
        value: in2peta@gmail.com
      - key: PHYSICAL_ADDRESS
        sync: false
      - key: UNSUBSCRIBE_URL
        sync: false
      # AI drafting (shared by both surfaces)
      - key: IN2PETA_API_URL
        value: https://code.in2peta.com/v1
      - key: IN2PETA_MODEL
        value: deepseek-v4-flash
      - key: IN2PETA_API_KEY
        sync: false
      - key: LITELLM_BASE_URL
        value: https://code.in2peta.com/v1
      - key: LITELLM_MASTER_KEY
        sync: false
      - key: LITELLM_MODEL
        value: kimi-k3
      - key: API_KEY_ENCRYPTION_KEY
        sync: false
      # GrowthCrew lead finder (docs/lead-finder-spec.md)
      - key: FINDER_FROM_INBOX
        sync: false
      - key: FINDER_DIGEST_SECRET
        sync: false
      - key: FRONTEND_URL
        value: http://localhost:5173
      - key: FINDER_SCHEDULER
        value: "1"
